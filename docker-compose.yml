# Local development services. On the VPS, web, worker and Caddy are added later.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tbe
      POSTGRES_USER: tbe
      POSTGRES_PASSWORD: tbe
      TZ: Europe/Prague
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbe -d tbe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
